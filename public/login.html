<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In • PayPerpendicular UPI Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Cyber Background */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(16, 185, 129, 0.05) 50%, transparent 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      text-decoration: none;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(16, 185, 129, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.08);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #10b981, #a855f7);
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .card-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 30px;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 700;
      color: #0b0f19;
      background: #ffffff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    }

    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.3);
      background: #f8fafc;
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .feedback-box {
      display: none;
      font-size: 12.5px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 16px;
      text-align: left;
      line-height: 1.45;
    }

    .footer-security {
      margin-top: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-home:hover {
      color: #38bdf8;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <a href="/" class="brand-header">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">PayPerpendicular</div>
    </a>

    <div class="login-card">
      <div class="card-badge">🔐 Single Gateway Sign In</div>
      <h1 class="card-title">Welcome Back</h1>
      <p class="card-subtitle">
        Sign in with Google to enter your personal UPI gateway terminal or merchant dashboard.
      </p>

      <button type="button" class="btn-google" id="btnGoogleSignIn" onclick="handleUnifiedSignIn()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="btnText">Continue with Google</span>
      </button>

      <div id="authFeedback" class="feedback-box"></div>

      <div class="footer-security">
        <span>🛡️</span>
        <span>Secure OAuth 2.0 Google Identity Verification</span>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="/" class="back-home">← Back to Homepage</a>
    </div>

  </div>

  <script>
    // Dynamically resolve Gateway Backend URL
    const API_BASE = (window.location.hostname.includes('paypendicular') || window.location.hostname.includes('upigateway') || window.location.hostname.includes('web.app') || window.location.hostname.includes('firebaseapp.com')) 
      ? 'https://payment-gateway-ydl1.onrender.com' 
      : '';

    const REQUIRED_ADMIN_EMAIL = 'hapa1929@gmail.com';

    const firebaseConfig = {
      apiKey: "AIzaSyCdeUo_GtvqTlgq-gXG71wtPPehC2mCOpw",
      authDomain: "upigateway-ccaa4.firebaseapp.com",
      databaseURL: "https://upigateway-ccaa4-default-rtdb.firebaseio.com",
      projectId: "upigateway-ccaa4",
      storageBucket: "upigateway-ccaa4.firebasestorage.app",
      messagingSenderId: "493744816437",
      appId: "1:493744816437:web:6316a146951e7f0b8d0c7c",
      measurementId: "G-096R1MKTV2"
    };

    let fbApp = null;
    let fbAuth = null;

    try {
      if (typeof firebase !== 'undefined') {
        fbApp = firebase.initializeApp(firebaseConfig);
        fbAuth = firebase.auth();
      }
    } catch (e) {
      console.warn('[Firebase] Init:', e.message);
    }

    // Auto-check stored session or active auth state
    if (fbAuth) {
      fbAuth.onAuthStateChanged((user) => {
        if (user) {
          routeAuthenticatedUser(user);
        }
      });
    }

    async function handleUnifiedSignIn() {
      if (!fbAuth) {
        alert('Authentication service is initializing. Please check your internet connection.');
        return;
      }

      const btn = document.getElementById('btnGoogleSignIn');
      const btnText = document.getElementById('btnText');
      const feedback = document.getElementById('authFeedback');

      btn.disabled = true;
      btnText.innerHTML = '<span style="display:inline-flex; align-items:center; gap:8px;"><span class="spinner"></span> Connecting to Google...</span>';
      if (feedback) feedback.style.display = 'none';

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await fbAuth.signInWithPopup(provider);
        await routeAuthenticatedUser(result.user);
      } catch (err) {
        console.error('Google Sign-In Error:', err);
        if (feedback) {
          feedback.style.display = 'block';
          feedback.style.background = 'rgba(239, 68, 68, 0.15)';
          feedback.style.border = '1px solid rgba(239, 68, 68, 0.3)';
          feedback.style.color = '#f87171';
          feedback.innerText = 'Sign-In Failed: ' + (err.message || 'Window closed');
        }
        btn.disabled = false;
        btnText.innerText = 'Continue with Google';
      }
    }

    async function routeAuthenticatedUser(user) {
      const email = (user.email || '').toLowerCase().trim();
      const feedback = document.getElementById('authFeedback');
      const btn = document.getElementById('btnGoogleSignIn');
      const btnText = document.getElementById('btnText');

      if (btn) btn.disabled = true;
      if (btnText) btnText.innerText = 'Routing to your dashboard...';

      if (feedback) {
        feedback.style.display = 'block';
        feedback.style.background = 'rgba(16, 185, 129, 0.15)';
        feedback.style.border = '1px solid rgba(16, 185, 129, 0.3)';
        feedback.style.color = '#34d399';
      }

      // Check if Admin
      if (email === REQUIRED_ADMIN_EMAIL.toLowerCase()) {
        sessionStorage.setItem('gateway_admin_auth', 'google');
        sessionStorage.setItem('gateway_admin_email', email);
        sessionStorage.setItem('gateway_master_key', 'shivambhatt@admin');
        localStorage.setItem('admin_master_key', 'shivambhatt@admin');

        if (feedback) feedback.innerHTML = '⚡ <b>SuperAdmin Verified!</b> Redirecting to Admin Terminal...';
        setTimeout(() => {
          window.location.href = '/admin';
        }, 400);
      } else {
        // Regular Merchant / User
        if (feedback) feedback.innerHTML = '👤 <b>Merchant Verified!</b> Preparing dashboard...';
        try {
          const res = await fetch((API_BASE || '') + '/api/v1/user/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              name: user.displayName || 'User',
              photoUrl: user.photoURL || ''
            })
          });
          const data = await res.json();
          if (data.success && data.user) {
            sessionStorage.setItem('gateway_user', JSON.stringify(data.user));
          }
        } catch (e) {
          console.warn('[Sync Error]', e);
        }

        setTimeout(() => {
          window.location.href = '/user';
        }, 400);
      }
    }

    window.handleUnifiedSignIn = handleUnifiedSignIn;
  </script>
</body>
</html>
