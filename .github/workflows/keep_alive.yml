name: 24x7 Keep Alive Human Simulation Engine

on:
  schedule:
    # Triggers every 10 minutes throughout the day (24/7/365)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  simulate-human-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Human-Disguised Random Interval & Page Rotation
        run: |
          # 1. Random delay between 5 to 35 seconds to avoid robotic interval fingerprinting
          SLEEP_SECS=$((5 + RANDOM % 30))
          echo "Simulating natural human browsing delay: ${SLEEP_SECS}s"
          sleep $SLEEP_SECS

          # 2. List of genuine public pages to rotate
          URLS=(
            "https://personal-payment-gateway.onrender.com/"
            "https://personal-payment-gateway.onrender.com/docs"
            "https://personal-payment-gateway.onrender.com/login"
            "https://personal-payment-gateway.onrender.com/api/plans"
            "https://personal-payment-gateway.onrender.com/health"
          )

          # 3. Pick a random endpoint
          RANDOM_INDEX=$((RANDOM % ${#URLS[@]}))
          TARGET_URL="${URLS[$RANDOM_INDEX]}"
          echo "Simulating browser navigation to: $TARGET_URL"

          # 4. Execute curl with full standard Chrome desktop browser headers
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9,hi;q=0.8" \
            -H "Sec-Fetch-Site: none" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-User: ?1" \
            -H "Sec-Fetch-Dest: document" \
            --compressed \
            --connect-timeout 20 \
            --max-time 45 \
            "$TARGET_URL")

          echo "Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Server successfully stimulated! Keep-alive active."
          else
            echo "⚠️ Notice: Server returned status $HTTP_STATUS (Wake-up signal received)"
          fi
