services:
  - type: web
    name: personal-upi-gateway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # ⚠️ ALL SENSITIVE VALUES MOVED TO RENDER DASHBOARD (Environment tab)
      # Go to: https://dashboard.render.com → your service → Environment
      # Set these keys there manually (NOT in this file):
      #
      # MERCHANT_UPI_VPA        = your_upi@bank
      # MERCHANT_NAME           = YourStoreName
      # ORDER_EXPIRY_MINUTES    = 5
      # IMAP_ENABLED            = true
      # IMAP_HOST               = imap.gmail.com
      # IMAP_PORT               = 993
      # IMAP_SECURE             = true
      # IMAP_USER               = your_email@gmail.com
      # IMAP_PASS               = your_16_char_app_password
      # IMAP_MAILBOX            = INBOX
      # IMAP_SENDER_FILTER      = fampay,famapp,fam
      # ADMIN_SECRET_KEY        = your_admin_key
      # API_KEY                 = your_api_key
      # REQUIRE_API_KEY         = true
